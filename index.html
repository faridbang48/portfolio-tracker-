<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mein Portfolio</title>

  <!-- ===== AUSSEHEN (CSS) ===== -->
  <style>
    /* Farben an einer Stelle, damit man sie leicht ändern kann */
    :root {
      --hintergrund: #0f1115;
      --karte: #1a1d24;
      --rand: #2a2f3a;
      --text: #e8eaed;
      --text-leise: #9aa0a6;
      --gewinn: #34c47c;
      --verlust: #ff5c5c;
      --akzent: #4c8dff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--hintergrund);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 17px;
      line-height: 1.4;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    h1 { font-size: 28px; margin: 0 0 20px; }
    h2 { font-size: 20px; margin: 32px 0 12px; }

    .karte {
      background: var(--karte);
      border: 1px solid var(--rand);
      border-radius: 14px;
      padding: 16px;
    }

    /* --- Übersicht oben (4 Kacheln) --- */
    .uebersicht {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .kachel-titel { color: var(--text-leise); font-size: 14px; }
    .kachel-wert { font-size: 24px; font-weight: 600; margin-top: 4px; }

    /* --- Eingabe-Formular --- */
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      align-items: end;
    }
    label { display: block; color: var(--text-leise); font-size: 14px; margin-bottom: 6px; }
    input {
      width: 100%;
      min-height: 48px;           /* groß genug für den Finger auf dem iPad */
      padding: 10px 12px;
      font-size: 17px;            /* verhindert automatisches Zoomen auf iOS */
      color: var(--text);
      background: var(--hintergrund);
      border: 1px solid var(--rand);
      border-radius: 10px;
    }
    input:focus { outline: 2px solid var(--akzent); border-color: transparent; }

    button {
      min-height: 48px;
      padding: 10px 18px;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .knopf-haupt { background: var(--akzent); color: white; }
    .knopf-loeschen {
      background: transparent;
      color: var(--verlust);
      border: 1px solid var(--rand);
      min-height: 44px;
      padding: 8px 14px;
      font-size: 15px;
    }

    .fehler { color: var(--verlust); margin: 10px 0 0; min-height: 1em; }

    /* --- Liste der Aktien --- */
    .aktie { margin-bottom: 12px; }
    .aktie-kopf {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .aktie-name { font-size: 20px; font-weight: 600; word-break: break-word; }
    .werte {
      display: grid;
      grid-template-columns: repeat(3, 1fr);   /* 2 ordentliche Zeilen à 3 */
      gap: 12px;
    }
    @media (max-width: 500px) {
      .werte { grid-template-columns: repeat(2, 1fr); }  /* Handy: 2 Spalten */
    }
    .wert-titel { color: var(--text-leise); font-size: 13px; }
    .wert-zahl { font-size: 18px; font-weight: 500; }
    .kurs-feld { min-height: 44px; padding: 6px 10px; }

    .plus  { color: var(--gewinn); }
    .minus { color: var(--verlust); }

    /* --- Sicherungskopie --- */
    .knopf-zweit {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--rand);
    }
    .sicherung-knoepfe { display: flex; flex-wrap: wrap; gap: 12px; }
    .sicherung-knoepfe button { flex: 1 1 200px; }
    .sicherung-info { color: var(--text-leise); font-size: 14px; margin: 12px 0 0; }
    .meldung { margin: 10px 0 0; min-height: 1em; }
    .meldung.ok { color: var(--gewinn); }
    .meldung.fehler { color: var(--verlust); }

    .leer { color: var(--text-leise); text-align: center; padding: 32px 16px; }
    .hinweis { color: var(--text-leise); font-size: 14px; margin-top: 24px; }
  </style>
</head>
<body>
<main>

  <h1>Mein Portfolio</h1>

  <!-- ===== ÜBERSICHT ===== -->
  <section class="uebersicht">
    <div class="karte">
      <div class="kachel-titel">Gesamtwert</div>
      <div class="kachel-wert" id="gesamtwert">–</div>
    </div>
    <div class="karte">
      <div class="kachel-titel">Investiert</div>
      <div class="kachel-wert" id="investiert">–</div>
    </div>
    <div class="karte">
      <div class="kachel-titel">Gewinn / Verlust</div>
      <div class="kachel-wert" id="gesamt-gv">–</div>
    </div>
    <div class="karte">
      <div class="kachel-titel">Rendite</div>
      <div class="kachel-wert" id="gesamt-rendite">–</div>
    </div>
  </section>

  <!-- ===== NEUE AKTIE EINTRAGEN ===== -->
  <h2>Aktie hinzufügen</h2>
  <div class="karte">
    <form id="formular">
      <div>
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="z. B. Apple" autocomplete="off">
      </div>
      <div>
        <label for="stueck">Stückzahl</label>
        <input id="stueck" type="text" inputmode="decimal" placeholder="10">
      </div>
      <div>
        <label for="kaufpreis">Kaufpreis (€ pro Stück)</label>
        <input id="kaufpreis" type="text" inputmode="decimal" placeholder="150,00">
      </div>
      <div>
        <label for="kurs">Aktueller Kurs (€)</label>
        <input id="kurs" type="text" inputmode="decimal" placeholder="175,50">
      </div>
      <button type="submit" class="knopf-haupt">Hinzufügen</button>
    </form>
    <p class="fehler" id="fehler"></p>
  </div>

  <!-- ===== MEINE AKTIEN ===== -->
  <h2>Meine Aktien</h2>
  <div id="liste"></div>

  <!-- ===== SICHERUNGSKOPIE ===== -->
  <h2>Sicherungskopie</h2>
  <div class="karte">
    <div class="sicherung-knoepfe">
      <button type="button" class="knopf-zweit" id="sichern">Sicherung erstellen</button>
      <button type="button" class="knopf-zweit" id="laden">Sicherung laden</button>
    </div>
    <!-- Unsichtbares Feld zur Dateiauswahl; wird vom Knopf "Sicherung laden" geöffnet -->
    <input type="file" id="datei" accept=".json,application/json" hidden>
    <p class="sicherung-info" id="letzte-sicherung"></p>
    <p class="meldung" id="sicherung-meldung"></p>
  </div>

  <p class="hinweis">
    Deine Daten werden nur in diesem Browser auf diesem Gerät gespeichert –
    nicht im Internet und nicht im Code.
  </p>

</main>

<!-- ===== LOGIK (JavaScript) ===== -->
<script>
  // Unter diesem Namen legt der Browser die Daten ab.
  const SPEICHER_SCHLUESSEL = "portfolio-aktien";

  // ---------- 1. Daten laden & speichern ----------

  function ladeAktien() {
    try {
      const text = localStorage.getItem(SPEICHER_SCHLUESSEL);
      return text ? JSON.parse(text) : [];
    } catch (e) {
      return []; // z. B. im privaten Modus: dann starten wir einfach leer
    }
  }

  function speichereAktien() {
    try {
      localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(aktien));
    } catch (e) {
      zeigeFehler("Speichern hat nicht geklappt (privater Modus?).");
    }
  }

  let aktien = ladeAktien();

  // ---------- 2. Hilfsfunktionen ----------

  // Erlaubt deutsche Schreibweise: "1.234,56" -> 1234.56
  function leseZahl(text) {
    const sauber = String(text).trim().replace(/\./g, "").replace(",", ".");
    if (sauber === "") return NaN;
    return Number(sauber);
  }

  const euroFormat = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" });
  const prozentFormat = new Intl.NumberFormat("de-DE", {
    style: "percent", minimumFractionDigits: 2, maximumFractionDigits: 2
  });

  function euro(zahl) { return euroFormat.format(zahl); }

  // Zeigt + oder − vor der Zahl, damit man es sofort sieht
  function mitVorzeichen(text, zahl) { return (zahl > 0 ? "+" : "") + text; }

  function farbe(element, zahl) {
    element.classList.remove("plus", "minus");
    if (zahl > 0) element.classList.add("plus");
    if (zahl < 0) element.classList.add("minus");
  }

  function zeigeFehler(text) { document.getElementById("fehler").textContent = text; }

  // ---------- 3. Rechnen ----------

  function berechne(aktie) {
    const investiert = aktie.stueck * aktie.kaufpreis;
    const wert = aktie.stueck * aktie.kurs;
    const gewinn = wert - investiert;
    const rendite = investiert > 0 ? gewinn / investiert : 0;
    return { investiert, wert, gewinn, rendite };
  }

  // ---------- 4. Anzeigen ----------

  function zeigeAlles() {
    zeigeUebersicht();
    zeigeListe();
  }

  function zeigeUebersicht() {
    let investiert = 0;
    let wert = 0;
    for (const aktie of aktien) {
      const r = berechne(aktie);
      investiert += r.investiert;
      wert += r.wert;
    }
    const gewinn = wert - investiert;
    const rendite = investiert > 0 ? gewinn / investiert : 0;

    document.getElementById("gesamtwert").textContent = euro(wert);
    document.getElementById("investiert").textContent = euro(investiert);

    const gv = document.getElementById("gesamt-gv");
    gv.textContent = mitVorzeichen(euro(gewinn), gewinn);
    farbe(gv, gewinn);

    const re = document.getElementById("gesamt-rendite");
    re.textContent = mitVorzeichen(prozentFormat.format(rendite), rendite);
    farbe(re, rendite);
  }

  // Baut ein kleines "Titel + Zahl"-Kästchen
  function wertKasten(titel, inhalt, farbZahl) {
    const kasten = document.createElement("div");
    const t = document.createElement("div");
    t.className = "wert-titel";
    t.textContent = titel;
    kasten.appendChild(t);
    if (typeof inhalt === "string") {
      const z = document.createElement("div");
      z.className = "wert-zahl";
      z.textContent = inhalt;
      if (farbZahl !== undefined) farbe(z, farbZahl);
      kasten.appendChild(z);
    } else {
      kasten.appendChild(inhalt); // z. B. ein Eingabefeld
    }
    return kasten;
  }

  function zeigeListe() {
    const liste = document.getElementById("liste");
    liste.innerHTML = "";

    if (aktien.length === 0) {
      liste.innerHTML = '<div class="karte leer">Noch keine Aktien eingetragen.</div>';
      return;
    }

    aktien.forEach((aktie, index) => {
      const r = berechne(aktie);

      const karte = document.createElement("div");
      karte.className = "karte aktie";

      // Kopfzeile: Name + Löschen-Knopf
      const kopf = document.createElement("div");
      kopf.className = "aktie-kopf";
      const name = document.createElement("div");
      name.className = "aktie-name";
      name.textContent = aktie.name; // textContent = sicher, kein HTML
      const loeschen = document.createElement("button");
      loeschen.className = "knopf-loeschen";
      loeschen.textContent = "Löschen";
      loeschen.addEventListener("click", () => {
        if (confirm(`„${aktie.name}“ wirklich löschen?`)) {
          aktien.splice(index, 1);
          speichereAktien();
          zeigeAlles();
        }
      });
      kopf.append(name, loeschen);

      // Aktueller Kurs ist direkt änderbar (ändert sich ja ständig)
      const kursFeld = document.createElement("input");
      kursFeld.className = "kurs-feld";
      kursFeld.inputMode = "decimal";
      kursFeld.value = String(aktie.kurs).replace(".", ",");
      kursFeld.addEventListener("change", () => {
        const neu = leseZahl(kursFeld.value);
        if (isNaN(neu) || neu < 0) {
          kursFeld.value = String(aktie.kurs).replace(".", ",");
          return;
        }
        aktie.kurs = neu;
        speichereAktien();
        zeigeAlles();
      });

      const werte = document.createElement("div");
      werte.className = "werte";
      werte.append(
        wertKasten("Stückzahl", aktie.stueck.toLocaleString("de-DE")),
        wertKasten("Kaufpreis", euro(aktie.kaufpreis)),
        wertKasten("Aktueller Kurs (€)", kursFeld),
        wertKasten("Wert", euro(r.wert)),
        wertKasten("Gewinn / Verlust", mitVorzeichen(euro(r.gewinn), r.gewinn), r.gewinn),
        wertKasten("Rendite", mitVorzeichen(prozentFormat.format(r.rendite), r.rendite), r.rendite)
      );

      karte.append(kopf, werte);
      liste.appendChild(karte);
    });
  }

  // ---------- 5. Formular: neue Aktie ----------

  document.getElementById("formular").addEventListener("submit", (ereignis) => {
    ereignis.preventDefault(); // Seite nicht neu laden

    const name = document.getElementById("name").value.trim();
    const stueck = leseZahl(document.getElementById("stueck").value);
    const kaufpreis = leseZahl(document.getElementById("kaufpreis").value);
    const kurs = leseZahl(document.getElementById("kurs").value);

    if (!name) return zeigeFehler("Bitte einen Namen eingeben.");
    if (isNaN(stueck) || stueck <= 0) return zeigeFehler("Stückzahl muss eine Zahl größer 0 sein.");
    if (isNaN(kaufpreis) || kaufpreis < 0) return zeigeFehler("Kaufpreis muss eine Zahl sein.");
    if (isNaN(kurs) || kurs < 0) return zeigeFehler("Aktueller Kurs muss eine Zahl sein.");

    zeigeFehler("");
    aktien.push({ name, stueck, kaufpreis, kurs });
    speichereAktien();
    zeigeAlles();
    ereignis.target.reset();
    document.getElementById("name").focus();
  });

  // ---------- 6. Sicherungskopie ----------

  const LETZTE_SICHERUNG_SCHLUESSEL = "portfolio-letzte-sicherung";

  function sicherungMeldung(text, art) {
    const el = document.getElementById("sicherung-meldung");
    el.textContent = text;
    el.className = "meldung " + (art || "");
  }

  function zeigeLetzteSicherung() {
    let datum = null;
    try { datum = localStorage.getItem(LETZTE_SICHERUNG_SCHLUESSEL); } catch (e) {}
    document.getElementById("letzte-sicherung").textContent = datum
      ? "Letzte Sicherung: " + new Date(datum).toLocaleString("de-DE")
      : "Noch keine Sicherung erstellt.";
  }

  function merkeSicherung() {
    try { localStorage.setItem(LETZTE_SICHERUNG_SCHLUESSEL, new Date().toISOString()); } catch (e) {}
    zeigeLetzteSicherung();
  }

  // Sicherung erstellen: Daten als Datei, z. B. in die Dateien-App
  document.getElementById("sichern").addEventListener("click", async () => {
    if (aktien.length === 0) return sicherungMeldung("Es gibt noch nichts zu sichern.", "fehler");

    const inhalt = JSON.stringify({
      app: "portfolio-tracker",
      version: 1,
      erstellt: new Date().toISOString(),
      aktien: aktien
    }, null, 2);
    const heute = new Date().toISOString().slice(0, 10); // z. B. 2026-11-17
    const dateiname = `portfolio-sicherung-${heute}.json`;
    const datei = new File([inhalt], dateiname, { type: "application/json" });

    // Auf dem iPad: das Teilen-Menü öffnen ("In Dateien sichern")
    if (navigator.canShare && navigator.canShare({ files: [datei] })) {
      try {
        await navigator.share({ files: [datei], title: dateiname });
        merkeSicherung();
        sicherungMeldung("Sicherung erstellt.", "ok");
      } catch (e) {
        // Abgebrochen: kein Fehler, einfach nichts tun
        if (e.name !== "AbortError") sicherungMeldung("Sicherung hat nicht geklappt.", "fehler");
      }
      return;
    }

    // Auf anderen Geräten (z. B. Computer): als Download speichern
    const link = document.createElement("a");
    link.href = URL.createObjectURL(datei);
    link.download = dateiname;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    merkeSicherung();
    sicherungMeldung("Sicherung heruntergeladen.", "ok");
  });

  // Prüft, ob eine Aktie aus der Datei sinnvolle Werte hat
  function istGueltigeAktie(a) {
    return a && typeof a.name === "string" && a.name.trim() !== "" &&
      [a.stueck, a.kaufpreis, a.kurs].every(z => typeof z === "number" && isFinite(z) && z >= 0) &&
      a.stueck > 0;
  }

  // Sicherung laden: Datei auswählen und Daten ersetzen
  document.getElementById("laden").addEventListener("click", () => {
    document.getElementById("datei").click();
  });

  document.getElementById("datei").addEventListener("change", async (ereignis) => {
    const datei = ereignis.target.files[0];
    ereignis.target.value = ""; // damit dieselbe Datei später nochmal gewählt werden kann
    if (!datei) return;

    let daten;
    try {
      daten = JSON.parse(await datei.text());
    } catch (e) {
      return sicherungMeldung("Diese Datei ist keine gültige Sicherung.", "fehler");
    }

    const liste = Array.isArray(daten) ? daten : daten && daten.aktien;
    if (!Array.isArray(liste) || !liste.every(istGueltigeAktie)) {
      return sicherungMeldung("Diese Datei ist keine gültige Sicherung.", "fehler");
    }

    const frage = aktien.length > 0
      ? `Sicherung mit ${liste.length} Aktie(n) laden?\nDeine aktuellen ${aktien.length} Aktie(n) werden dabei ersetzt.`
      : `Sicherung mit ${liste.length} Aktie(n) laden?`;
    if (!confirm(frage)) return;

    aktien = liste.map(a => ({ name: a.name.trim(), stueck: a.stueck, kaufpreis: a.kaufpreis, kurs: a.kurs }));
    speichereAktien();
    zeigeAlles();
    sicherungMeldung(`Sicherung geladen: ${aktien.length} Aktie(n).`, "ok");
  });

  // ---------- Start ----------
  zeigeAlles();
  zeigeLetzteSicherung();
</script>
</body>
</html>
